plugins { id 'com.android.application' }

def runNo = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer

android {
    namespace 'ru.slom.hunter'
    compileSdk 35
    defaultConfig {
        applicationId 'ru.slom.hunter'
        minSdk 26
        targetSdk 35
        versionCode runNo
        versionName "1.${runNo}"
    }
    signingConfigs {
        release {
            storeFile file('../hunter.jks')
            storePassword 'hunter-app'
            keyAlias 'hunter'
            keyPassword 'hunter-app'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
        debug { signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError false; checkReleaseBuilds false }
}
