name: Сборка приложения (APK)

on:
  push:
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build
        run: gradle -p android assembleRelease --no-daemon --stacktrace
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk hunter.apk && ls -la hunter.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hunter-apk
          path: hunter.apk
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Охотник ${{ github.run_number }}
          body: Приложение «Охотник» для Android. Установка — файл hunter.apk.
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: hunter.apk
